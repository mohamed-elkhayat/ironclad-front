<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ironclad Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Saira+Stencil+One&display=swap">
<style>
/* Layout: full-bleed battlefield canvas, command sidebar on the right (compact bottom console on phones). Single dark field-console look by design. */
:root {
  --ink: #0c110f;
  --panel: #141b18;
  --panel2: #1b2420;
  --line: #2b3832;
  --text: #d5e0d8;
  --dim: #7d9187;
  --amber: #e2b13c;
  --ok: #6fd38b;
  --bad: #e5533d;
  --blue: #4fc3d9;
  --red: #e8643c;
  --display: 'Saira Stencil One', Impact, 'Arial Narrow', sans-serif;
  --ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--ui); overflow: hidden; overscroll-behavior: none; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font-family: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
#app { display: flex; height: 100%; }
#view { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
#side { width: 240px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .04em; color: var(--amber); line-height: 1; }
.brand small { display: block; font-family: var(--ui); font-size: 10px; letter-spacing: .18em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res > div { background: var(--panel2); border: 1px solid var(--line); padding: 6px 8px; min-width: 0; }
.lbl { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); }
#cr { font-size: 18px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: #0a0e0c; margin-top: 6px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--ok); width: 0; }
#ptx { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
.radar { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; background: #050807; border: 1px solid var(--line); }
#mini { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
#radarOff { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 12px; letter-spacing: .14em; color: var(--dim); background: repeating-linear-gradient(0deg, #0a0f0d 0 2px, #070a09 2px 4px); padding: 4px; }
#radarOff small { letter-spacing: .04em; margin-top: 4px; font-size: 11px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tabs button { background: var(--panel2); border: 1px solid var(--line); padding: 7px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; white-space: nowrap; overflow: hidden; }
.tabs button.on { border-color: var(--amber); color: var(--amber); }
#build { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bb { position: relative; background: var(--panel2); border: 1px solid var(--line); padding: 4px 4px 5px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; overflow: hidden; min-width: 0; }
.bb canvas { width: 100%; height: auto; aspect-ratio: 64 / 44; display: block; background: #0d1311; }
.bb .nm { font-size: 11px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bb .ct { font-size: 11px; color: var(--amber); font-variant-numeric: tabular-nums; }
.bb .pg { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--amber); width: 0; }
.bb .ov { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.bb .qn { position: absolute; top: 4px; right: 4px; background: var(--amber); color: #111; font-size: 11px; font-weight: 700; padding: 0 5px; display: none; }
.bb .x { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border: 1px solid var(--line); background: rgba(12,17,15,.85); color: var(--text); font-size: 14px; line-height: 20px; text-align: center; display: none; z-index: 2; }
.bb.has .x { display: block; }
.bb.lock { cursor: not-allowed; }
.bb.lock canvas, .bb.lock .nm, .bb.lock .ct { opacity: .35; }
.bb.lock .ov { display: flex; color: var(--dim); font-size: 10px; letter-spacing: .04em; text-transform: none; padding: 0 6px; text-align: center; background: rgba(12,17,15,.55); }
.bb.ready { border-color: var(--amber); }
.bb.ready .ov { display: flex; color: var(--amber); background: rgba(12,17,15,.7); animation: pulse 1s infinite alternate; }
.bb.busy .ov { display: flex; color: var(--text); background: rgba(12,17,15,.45); font-size: 10px; }
@keyframes pulse { from { opacity: .6 } to { opacity: 1 } }
#info { background: var(--panel2); border: 1px solid var(--line); padding: 8px; font-size: 12px; min-height: 56px; display: flex; flex-direction: column; gap: 6px; }
#info .t { font-weight: 700; font-size: 13px; }
#info .muted { color: var(--dim); }
.hpb { height: 5px; background: #0a0e0c; }
.hpb i { display: block; height: 100%; background: var(--ok); }
.tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
.tools button, #info button { background: var(--panel2); border: 1px solid var(--line); padding: 6px 4px; font-size: 11px; cursor: pointer; }
.tools button:hover, .tabs button:hover, .bb:not(.lock):hover, #info button:hover { border-color: var(--dim); }
#msgs { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; right: 80px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
#msgs div { background: rgba(10,14,12,.8); border-left: 3px solid var(--amber); padding: 4px 10px; font-size: 13px; letter-spacing: .03em; max-width: 100%; }
#msgs div.bad { border-left-color: var(--bad); }
#hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,14,12,.85); border: 1px solid var(--amber); color: var(--amber); padding: 5px 12px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
#mpTag { position: absolute; top: 10px; right: max(10px, env(safe-area-inset-right, 0px)); background: rgba(10,14,12,.8); border: 1px solid var(--line); padding: 4px 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); pointer-events: none; }
#mpTag b { color: var(--ok); }
/* touch action bar */
#acts { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
#acts button { width: 58px; height: 50px; background: rgba(20,27,24,.9); border: 1px solid var(--line); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
#acts button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#acts button.on { border-color: var(--amber); color: var(--amber); background: rgba(40,33,14,.92); }
#acts button:disabled { opacity: .35; }
/* overlay */
#ov { position: absolute; inset: 0; z-index: 5; display: flex; align-items: flex-start; justify-content: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(ellipse at 30% 20%, rgba(226,177,60,.08), transparent 60%), rgba(6,9,8,.92); overflow-y: auto; }
.card { width: min(560px, 100%); display: flex; flex-direction: column; gap: 16px; margin: auto 0; }
.card h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 9vw, 76px); line-height: .9; margin: 0; color: var(--amber); letter-spacing: .02em; text-wrap: balance; }
.card h2 { margin: 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.card .kick { font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--dim); }
.card p { margin: 0; line-height: 1.5; color: var(--text); max-width: 60ch; }
.card .note { font-size: 12px; color: var(--dim); }
.diff { display: flex; gap: 8px; flex-wrap: wrap; }
.diff button { flex: 1 1 140px; background: var(--panel2); border: 1px solid var(--line); padding: 12px 10px; cursor: pointer; text-align: left; }
.diff button b { display: block; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
.diff button span { font-size: 11px; color: var(--dim); }
.diff button:hover:not(:disabled) { border-color: var(--amber); }
.diff button:disabled { opacity: .45; cursor: not-allowed; }
.diff button.join { border-color: var(--ok); }
.note.warn { color: var(--amber); }
.note .reason { display: block; margin-top: 4px; color: var(--dim); font-size: 11px; }
#liveBtn { border-color: var(--amber); }
.live { color: var(--ok); }
.mpsect { border-top: 0; padding-top: 0; }
.joinrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.joinrow label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.joinrow input { flex: 1 1 120px; min-width: 0; background: var(--panel2); border: 1px solid var(--line); color: var(--text); font-family: var(--display); font-size: 22px; letter-spacing: .2em; padding: 6px 10px; text-transform: uppercase; }
.joinrow input:focus { outline: 2px solid var(--amber); outline-offset: 0; }
.joinrow button { background: var(--panel2); border: 1px solid var(--ok); color: var(--ok); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 10px 18px; cursor: pointer; }
.joinrow button:disabled { border-color: var(--line); color: var(--dim); cursor: not-allowed; }
.sect { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.code { font-family: var(--display); font-size: 44px; color: var(--ok); letter-spacing: .12em; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 12px; color: var(--dim); }
.keys kbd { font-family: var(--ui); color: var(--text); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stats div { background: var(--panel2); border: 1px solid var(--line); padding: 8px; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
@media (max-height: 560px) and (min-width: 761px) {
  #side { width: 210px; gap: 8px; padding-top: 8px; }
  .brand { font-size: 18px; } .brand small { display: none; }
  .radar { width: 70%; align-self: center; }
}
@media (max-width: 760px) {
  #app { flex-direction: column; }
  #side { width: auto; max-height: 46%; border-left: 0; border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-content: start; }
  .brand, .tools { display: none; }
  .radar { grid-column: 1; grid-row: 1 / span 3; align-self: start; }
  .res, .tabs, #build, #info { grid-column: 2; }
  .res > div { padding: 4px 6px; }
  #cr { font-size: 16px; }
  #build { display: flex; overflow-x: auto; gap: 6px; scroll-snap-type: x proximity; padding-bottom: 2px; }
  .bb { flex: 0 0 88px; scroll-snap-align: start; }
  #info { grid-column: 1 / -1; min-height: 0; padding: 6px 8px; font-size: 11px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  #info.idle { display: none; }
  #info .hpb { flex: 1 1 80px; }
  #msgs div { font-size: 12px; padding: 3px 8px; }
  #msgs { right: 70px; bottom: 8px; }
  #app:has(#ov:not([hidden])) #side { display: none; }
  #acts { bottom: 8px; gap: 6px; }
  #acts button { width: 52px; height: 44px; font-size: 9px; }
  #acts button svg { width: 18px; height: 18px; }
}
@media (prefers-reduced-motion: reduce) { .bb.ready .ov { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="map"></canvas>
    <div id="msgs"></div>
    <div id="hint" hidden></div>
    <div id="mpTag" hidden></div>
    <div id="acts" hidden>
      <button id="aBox" title="Drag to select units instead of scrolling"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" stroke-dasharray="3 3"/></svg>Select</button>
      <button id="aArmy" title="Select the whole army"><svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M3 19c1-3 3-4 5-4s4 1 5 4M11 19c1-3 3-4 5-4s4 1 5 4"/></svg>Army</button>
      <button id="aAtk" title="Attack-move: units engage anything on the way"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>Attack</button>
      <button id="aStop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></svg>Stop</button>
      <button id="aClear" title="Deselect or cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Clear</button>
    </div>
    <div id="ov"></div>
  </div>
  <aside id="side">
    <div class="brand">IRONCLAD FRONT<small id="sideSub">Vanguard field command</small></div>
    <div class="res">
      <div><span class="lbl">Credits</span><b id="cr">0</b></div>
      <div><span class="lbl">Power</span><div class="bar"><i id="pbar"></i></div><span id="ptx">0 / 0 MW</span></div>
    </div>
    <div class="radar"><canvas id="mini" width="128" height="128"></canvas><div id="radarOff">RADAR OFFLINE<small>Build a Radar Dome</small></div></div>
    <div class="tabs">
      <button id="tab-bld" data-tab="bld" class="on">Build</button>
      <button id="tab-inf" data-tab="inf">Infantry</button>
      <button id="tab-veh" data-tab="veh">Vehicles</button>
    </div>
    <div id="build"></div>
    <div id="info"></div>
    <div class="tools">
      <button id="bSel" title="Select every combat unit (Q)">Army</button>
      <button id="bSnd" title="Toggle sound">Sound</button>
      <button id="bPause" title="Pause (P)">Pause</button>
    </div>
  </aside>
</div>
<script>
'use strict';
// ================= constants & data =================
const T = 32, MW = 64, MH = 64, NN = MW * MH, WW = MW * T, WH = MH * T, TAU = Math.PI * 2;
const TEAMS = [
  { name: 'Vanguard', col: '#4fc3d9', dark: '#1d5d6b', light: '#a8eaf5' },
  { name: 'Syndicate', col: '#e8643c', dark: '#7c2a14', light: '#ffc0a6' },
];
const ARM = { inf: 0, light: 1, heavy: 2, bld: 3 };
const WPN = {
  rifle:  { range: 4,   dmg: 14, rof: 0.9, proj: 'bullet', vs: [1, .35, .2, .25], snd: 'gun' },
  rocket: { range: 5.5, dmg: 42, rof: 2.2, proj: 'rocket', speed: 260, vs: [.3, 1, 1, .7], snd: 'rocket' },
  cannon: { range: 4.5, dmg: 24, rof: 1.3, proj: 'shell', speed: 420, vs: [.5, 1, .65, .6], snd: 'cannon' },
  heavy:  { range: 5,   dmg: 44, rof: 1.9, proj: 'shell', speed: 420, vs: [.45, 1, 1, .8], snd: 'cannon' },
  arty:   { range: 9,   dmg: 80, rof: 4.5, proj: 'arc', speed: 220, splash: 1.3, vs: [1, .8, .5, 1], snd: 'arty' },
  turret: { range: 6,   dmg: 34, rof: 1.2, proj: 'shell', speed: 480, vs: [.7, 1, .8, .5], snd: 'cannon' },
};
const UDEF = {
  rifle:  { name: 'Rifleman',   cat: 'inf', from: 'barracks', cost: 100,  time: 4,  hp: 60,  speed: 30, armor: 'inf',   wpn: 'rifle',  sight: 5, r: 5 },
  rocket: { name: 'Rocketeer',  cat: 'inf', from: 'barracks', cost: 300,  time: 6,  hp: 50,  speed: 27, armor: 'inf',   wpn: 'rocket', sight: 6, r: 5 },
  ltank:  { name: 'Light Tank', cat: 'veh', from: 'factory',  cost: 700,  time: 9,  hp: 300, speed: 62, armor: 'light', wpn: 'cannon', sight: 6, r: 10 },
  htank:  { name: 'Heavy Tank', cat: 'veh', from: 'factory',  cost: 1150, time: 13, hp: 620, speed: 40, armor: 'heavy', wpn: 'heavy',  sight: 6, r: 12 },
  arty:   { name: 'Howitzer',   cat: 'veh', from: 'factory',  cost: 900,  time: 12, hp: 200, speed: 38, armor: 'light', wpn: 'arty',   sight: 7, r: 10, req: ['radar'] },
  harv:   { name: 'Harvester',  cat: 'veh', from: 'factory',  cost: 1200, time: 12, hp: 600, speed: 42, armor: 'heavy',               sight: 4, r: 12 },
};
const BDEF = {
  hq:       { name: 'Command Post', w: 3, h: 3, hp: 1600, cost: 0,    time: 1,  power: 0,   sight: 8, nobuild: true },
  power:    { name: 'Power Plant',  w: 2, h: 2, hp: 600,  cost: 300,  time: 7,  power: 100, sight: 4 },
  refinery: { name: 'Ore Refinery', w: 3, h: 2, hp: 1000, cost: 1600, time: 14, power: -30, sight: 5, req: ['power'] },
  barracks: { name: 'Barracks',     w: 2, h: 2, hp: 700,  cost: 400,  time: 8,  power: -20, sight: 5, req: ['power'] },
  factory:  { name: 'War Factory',  w: 3, h: 3, hp: 1200, cost: 1800, time: 16, power: -30, sight: 5, req: ['refinery'] },
  radar:    { name: 'Radar Dome',   w: 2, h: 2, hp: 800,  cost: 900,  time: 10, power: -40, sight: 9, req: ['refinery'] },
  turret:   { name: 'Gun Turret',   w: 1, h: 1, hp: 550,  cost: 550,  time: 7,  power: -15, sight: 7, req: ['barracks'], wpn: 'turret' },
};
for (const k in UDEF) { UDEF[k].type = k; UDEF[k].kind = 'u'; }
for (const k in BDEF) { BDEF[k].type = k; BDEF[k].kind = 'b'; BDEF[k].cat = 'bld'; BDEF[k].armor = 'bld'; }
const DEF = t => UDEF[t] || BDEF[t];
const TYPES = ['rifle', 'rocket', 'ltank', 'htank', 'arty', 'harv', 'hq', 'power', 'refinery', 'barracks', 'factory', 'radar', 'turret'];
const TIDX = Object.fromEntries(TYPES.map((t, i) => [t, i]));
const TABS = { bld: ['power', 'refinery', 'barracks', 'factory', 'radar', 'turret'], inf: ['rifle', 'rocket'], veh: ['ltank', 'htank', 'arty', 'harv'] };
const DIFF = {
  easy:   { label: 'Recruit',  income: 0.75, build: 0.8, firstWave: 330, interval: 150, wave: 4 },
  normal: { label: 'Veteran',  income: 1.0,  build: 1.0, firstWave: 240, interval: 120, wave: 6 },
  hard:   { label: 'Elite',    income: 1.35, build: 1.3, firstWave: 170, interval: 95,  wave: 8 },
};
const ORE_CAP = 700, ORE_MAX = 420;
const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
const rotTo = (a, b, m) => { const d = angDiff(a, b); return Math.abs(d) <= m ? b : a + Math.sign(d) * m; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash2 = (x, y, s) => { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
let ME = 0; // the team this screen commands

// ================= map =================
const terr = new Uint8Array(NN);   // 0 grass, 1 sand, 2 water, 3 rock
const ore = new Float32Array(NN);
const bocc = new Int32Array(NN);   // building id per tile
const vis = new Uint8Array(NN), expl = new Uint8Array(NN);
const BASES = [{ tx: 6, ty: 53 }, { tx: 55, ty: 8 }];
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const passable = (x, y) => inb(x, y) && terr[y * MW + x] < 2 && !bocc[y * MW + x];

function makeNoise(R, cells) {
  const g = []; for (let i = 0; i < (cells + 1) * (cells + 1); i++) g.push(R());
  const s = t => t * t * (3 - 2 * t);
  return (u, v) => {
    const x = u * cells, y = v * cells, x0 = Math.min(cells - 1, x | 0), y0 = Math.min(cells - 1, y | 0);
    const fx = s(x - x0), fy = s(y - y0), a = g[y0 * (cells + 1) + x0], b = g[y0 * (cells + 1) + x0 + 1], c = g[(y0 + 1) * (cells + 1) + x0], d = g[(y0 + 1) * (cells + 1) + x0 + 1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
}
// deterministic from the seed (plain arithmetic only) so both players get the same map
function genMap(seed) {

let lastT = performance.now(), panelT = 0, miniT = 0;
